<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>黑猫与 Clawd 的摇篮曲</title>
<style>
html,body{margin:0;height:100%;background:#1a1714;display:flex;align-items:center;justify-content:center}
canvas{width:min(94vmin,760px);height:min(94vmin,760px);border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);cursor:pointer}

<body>
<canvas id="c"></canvas>
<script>
const W = 640, H = 640;
const cv = document.getElementById('c');
const dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * dpr; cv.height = H * dpr;
const ctx = cv.getContext('2d');
ctx.scale(dpr, dpr);

// ---------- crayon toolkit ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = Math.random;
const rr = (a, b) => a + (b - a) * R();

function makeLayer() { const c = document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr); return [c, g]; }

function stroke(g, pts, color, w, opt = {}) {
  const passes = opt.passes ?? 2, jit = opt.jit ?? 1.2, alpha = opt.alpha ?? 0.9;
  g.save(); g.strokeStyle = color; g.lineCap = 'round'; g.lineJoin = 'round';
  for (let p = 0; p < passes; p++) {
    g.lineWidth = w * rr(0.65, 1.05);
    g.globalAlpha = alpha * rr(0.55, 0.95);
    g.setLineDash([rr(14, 40), rr(0.5, 2.5)]);
    g.lineDashOffset = rr(0, 30);
    g.beginPath();
    let first = true;
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 7));
      for (let k = (i === 0 ? 0 : 1); k <= n; k++) {
        const t = k / n;
        const x = x0 + (x1 - x0) * t + rr(-jit, jit) * 0.6, y = y0 + (y1 - y0) * t + rr(-jit, jit) * 0.6;
        if (first) { g.moveTo(x, y); first = false; } else g.lineTo(x, y);
      }
    }
    g.stroke();
  }
  g.restore();
}

function hatch(g, clip, bbox, color, opt = {}) {
  const [bx, by, bw, bh] = bbox;
  const ang = opt.angle ?? -0.9, gap = opt.gap ?? 3, w = opt.w ?? 1.6, alpha = opt.alpha ?? 0.7, layers = opt.layers ?? 2;
  g.save(); g.beginPath(); clip(g); g.clip();
  g.strokeStyle = color; g.lineCap = 'round';
  const cx = bx + bw / 2, cy = by + bh / 2, rad = Math.hypot(bw, bh) / 2 + 4;
  for (let L = 0; L < layers; L++) {
    const a = ang + L * (opt.cross ?? 0.35) + rr(-0.05, 0.05);
    const ca = Math.cos(a), sa = Math.sin(a);
    for (let o = -rad; o <= rad; o += gap * rr(0.7, 1.3)) {
      let s = -rad;
      while (s < rad) {
        const e = Math.min(rad, s + rr(opt.minLen ?? 20, opt.maxLen ?? 70));
        const j1 = rr(-0.8, 0.8), j2 = rr(-0.8, 0.8);
        g.globalAlpha = alpha * rr(0.45, 1);
        g.lineWidth = w * rr(0.6, 1.2);
        g.beginPath();
        g.moveTo(cx + ca * s - sa * (o + j1), cy + sa * s + ca * (o + j1));
        g.lineTo(cx + ca * e - sa * (o + j2), cy + sa * e + ca * (o + j2));
        g.stroke();
        s = e + rr(0, opt.skip ?? 4);
      }
    }
  }
  g.restore();
}

const wob = (pts, a) => pts.map(([x, y]) => [x + rr(-a, a), y + rr(-a, a)]);
const polyPath = pts => g => { g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); };
const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]];
function ellPts(cx, cy, rx, ry, n = 28) { const a = []; for (let i = 0; i <= n; i++) { const t = i / n * Math.PI * 2; a.push([cx + Math.cos(t) * rx, cy + Math.sin(t) * ry]); } return a; }
function fillPts(g, pts, col, a = 1) { g.save(); g.globalAlpha = a; g.fillStyle = col; g.beginPath(); polyPath(pts)(g); g.fill(); g.restore(); }
function box(g, x, y, w, h, fill, line, opt = {}) {
  if (opt.solid) fillPts(g, wob(rectPts(x, y, w, h), 0.8), opt.solid, opt.solidA ?? 1);
  hatch(g, polyPath(wob(rectPts(x, y, w, h), 1)), [x, y, w, h], fill, opt);
  if (line) stroke(g, wob(rectPts(x, y, w, h), 0.8), line, opt.lw ?? 1.6, { passes: 2 });
}
function crSpline(p, seg = 6) {
  const o = [];
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    for (let k = 0; k < seg; k++) {
      const t = k / seg, t2 = t * t, t3 = t2 * t;
      o.push([0, 1].map(j => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
    }
  }
  o.push(p[p.length - 1]);
  return o;
}
function label(g, text, x, y, size, col, alpha = 1) {
  g.save();
  g.font = `${size}px "Chalkboard SE","Comic Sans MS","Xingkai SC","STKaiti","KaiTi","Noto Sans CJK SC",cursive`;
  g.textAlign = 'center'; g.fillStyle = col;
  for (let i = 0; i < 3; i++) { g.globalAlpha = alpha * rr(0.45, 0.8); g.fillText(text, x + rr(-0.7, 0.7), y + rr(-0.7, 0.7)); }
  g.restore();
}

// ---------- the piece: "Lullaby for a Black Cat", F major, 80 bpm ----------
const BPM = 80, SPB = 60 / BPM, LOOP = 66;
const MEL = [
  [69, 1], [72, 1], [77, 1.5], [76, .5],
  [74, 1], [72, 1], [67, 2],
  [69, 1], [74, 1], [77, 1], [76, .5], [74, .5],
  [74, 1.5], [72, .5], [70, 2],
  [69, 1], [72, 1], [77, 1], [81, 1],
  [79, 1.5], [77, .5], [74, 2],
  [72, 1], [76, 1], [79, 1.5], [76, .5],
  [77, 3], [null, 1],
  [77, 1], [76, .5], [74, .5], [69, 2],
  [72, 1], [76, 1], [81, 2],
  [74, 1], [77, 1], [74, 1], [70, 1],
  [72, 1], [69, 1], [65, 2],
  [67, 1], [70, 1], [74, 1.5], [72, .5],
  [76, 1], [74, .5], [72, .5], [67, 2],
  [70, 1], [74, 1], [72, 1], [76, 1],
  [77, 4],
];
const CHORDS = [
  [[41, [48, 53, 57]]], [[40, [48, 52, 55]]], [[38, [45, 50, 53]]], [[46, [50, 53, 58]]],
  [[45, [48, 53, 57]]], [[43, [50, 53, 58]]], [[36, [46, 52, 55]]], [[41, [48, 53, 57]]],
  [[38, [45, 50, 53]]], [[45, [48, 52, 57]]], [[46, [50, 53, 58]]], [[41, [48, 53, 57]]],
  [[43, [50, 55, 58]]], [[36, [48, 52, 55]]], [[46, [50, 53, 58]], [36, [46, 52, 55]]],
  [[41, [48, 53, 57, 60]]],
];
const mel = [], notes = [];
{
  let b = 0;
  for (const [m, d] of MEL) { const n = { m, s: b, d, h: 0, vis: d - 0.08 }; mel.push(n); if (m !== null) notes.push(n); b += d; }
  CHORDS.forEach((segs, bar) => {
    const segLen = 4 / segs.length;
    segs.forEach(([bass, t], si) => {
      const s0 = bar * 4 + si * segLen;
      const seq = bar === 15 ? [bass, ...t] : [bass, t[0], t[1], t[2], t[1], t[0], t[1], t[2]].slice(0, segLen * 2);
      seq.forEach((m, i) => {
        const s = s0 + i * 0.5;
        notes.push({ m, s, d: s0 + segLen - s, h: i === 0 ? 2 : 1, vis: bar === 15 ? s0 + 4 - s : 0.18 });  // matches the tail's tap-and-hold
      });
    });
  });
}

// Dynamics: [beat, level] breakpoints, linear in between (p ≈ .45, mp ≈ .6, mf ≈ .75, f ≈ .95).
// MARKS is what gets printed under the staff: [beat, text] or [beat, hairpin, endBeat].
const DYN = [[0, .45], [8, .45], [16, .62], [20, .62], [24, .95], [28, .95], [32, .55], [44, .6], [48, .95], [56, .95], [60, .45], [66, .45]];
function level(b) {
  for (let i = 1; i < DYN.length; i++) { const [b1, v1] = DYN[i]; if (b <= b1) { const [b0, v0] = DYN[i - 1]; return v0 + (v1 - v0) * (b - b0) / (b1 - b0 || 1); } }
  return DYN[DYN.length - 1][1];
}
const MARKS = [[0, 'p'], [8, '<', 16], [16, 'mp'], [20, '<', 24], [24, 'f'], [28, '>', 32], [32, 'mp'], [44, '<', 48], [48, 'f'], [56, '>', 60], [60, 'p']];

// ---------- audio ----------
let actx = null, master, rev, wave, hardWave, noiseBuf, t0 = 0, loopsScheduled = 0;
function impulse(sec) {
  const n = actx.sampleRate * sec, b = actx.createBuffer(2, n, actx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.2); }
  return b;
}
// hammer "clack" for panicked hard hits: a short band-passed noise burst
function thump(t, amt) {
  const src = actx.createBufferSource(), bp = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 1.2;
  g.gain.setValueAtTime(.12 * amt, t); g.gain.exponentialRampToValueAtTime(.001, t + .05);
  src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t + .06);
}
function voice(m, t, d, v, long, bright = 1) {
  const f = 440 * Math.pow(2, (m - 69) / 12);
  const g = actx.createGain(), g2 = actx.createGain(), lp = actx.createBiquadFilter();
  lp.type = 'lowpass'; lp.Q.value = 0.3;
  lp.frequency.setValueAtTime(Math.min(f * 9 * bright, 14000), t);  // harder hit = brighter tone
  lp.frequency.setTargetAtTime(Math.max(f * 2.2 * bright, 400), t + 0.01, 0.35);
  const o1 = actx.createOscillator(), o2 = actx.createOscillator();
  o1.setPeriodicWave(wave); o2.setPeriodicWave(wave);
  o1.frequency.value = f; o2.frequency.value = f * 1.0013;
  g2.gain.value = 0.5;
  o1.connect(g); o2.connect(g2); g2.connect(g);
  if (bright > 1) {  // a hard hit excites the upper partials: blend in a harmonic-rich layer
    const o3 = actx.createOscillator(), g3 = actx.createGain();
    o3.setPeriodicWave(hardWave); o3.frequency.value = f; g3.gain.value = .45 * (bright - 1);
    o3.connect(g3); g3.connect(g); o3.start(t); o3.stop(Math.max(t + d, t + 0.26) + 0.8);
  }
  g.connect(lp); lp.connect(master); lp.connect(rev);
  const tau = 0.35 + 1.4 * Math.max(0, (84 - m) / 48);
  const rel = Math.max(t + d, t + 0.26);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(v, t + 0.006);
  g.gain.setTargetAtTime(v * 0.35, t + 0.006, 0.12);
  g.gain.setTargetAtTime(0, t + 0.25, tau);
  g.gain.setTargetAtTime(0, rel, long ? 0.9 : 0.09);
  const end = rel + (long ? 5 : 0.8);
  o1.start(t); o2.start(t); o1.stop(end); o2.stop(end);
}
function scheduleLoop(k) {
  const base = t0 + k * LOOP * SPB;
  for (const n of notes) {
    if (n.h === 0) continue;  // melody goes through schedMel
    const vel = (n.h === 2 ? 0.2 : 0.12) * level(n.s) / .75;
    voice(n.m, base + n.s * SPB + (Math.random() - 0.5) * 0.012, n.d * SPB, vel * (0.9 + Math.random() * 0.2), n.s >= 60);
  }
  loopsScheduled = k + 1;
}
function initAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 3;
  master = actx.createGain(); master.gain.value = 0.9;
  master.connect(comp); comp.connect(actx.destination);
  const conv = actx.createConvolver(); conv.buffer = impulse(2.8);
  rev = actx.createGain(); rev.gain.value = 0.28; rev.connect(conv); conv.connect(comp);
  wave = actx.createPeriodicWave(new Float32Array(8), new Float32Array([0, 1, .42, .2, .12, .07, .04, .02]));
  hardWave = actx.createPeriodicWave(new Float32Array(17), new Float32Array([0, 1, .7, .55, .45, .38, .32, .27, .23, .2, .17, .15, .13, .11, .1, .09, .08]));
  noiseBuf = actx.createBuffer(1, actx.sampleRate * .06, actx.sampleRate);
  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  t0 = actx.currentTime + CAT_READY;  // give the cat time to climb down before the first note
  startT = performance.now() / 1000;
  scheduleLoop(0);
  setInterval(() => { if (actx.currentTime > t0 + (loopsScheduled * LOOP - 8) * SPB) scheduleLoop(loopsScheduled); }, 500);
  setInterval(schedMel, 40);
}
// a small synthesized meow: pitch rises then falls, formants glide i -> a -> u
function meow(t) {
  const f0 = 520 + Math.random() * 120;
  const o = actx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(f0 * .9, t);
  o.frequency.linearRampToValueAtTime(f0 * 1.25, t + .18);
  o.frequency.linearRampToValueAtTime(f0 * .8, t + .55);
  const vib = actx.createOscillator(), vg = actx.createGain(); vib.frequency.value = 6; vg.gain.value = 8; vib.connect(vg); vg.connect(o.frequency);
  const f1 = actx.createBiquadFilter(), f2 = actx.createBiquadFilter(), g2 = actx.createGain(), g = actx.createGain();
  f1.type = f2.type = 'bandpass'; f1.Q.value = 6; f2.Q.value = 8; g2.gain.value = .5;
  f1.frequency.setValueAtTime(900, t); f1.frequency.linearRampToValueAtTime(1500, t + .2); f1.frequency.linearRampToValueAtTime(700, t + .55);
  f2.frequency.setValueAtTime(2600, t); f2.frequency.linearRampToValueAtTime(2200, t + .2); f2.frequency.linearRampToValueAtTime(1100, t + .55);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5, t + .05); g.gain.setValueAtTime(.5, t + .35); g.gain.linearRampToValueAtTime(0, t + .6);
  o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(g2); g2.connect(g); g.connect(master); g.connect(rev);
  o.start(t); vib.start(t); o.stop(t + .65); vib.stop(t + .65);
}
let melNext = 0;
function schedMel() {
  if (!actx || actx.state !== 'running') return;
  const N = hops.length, horizon = actx.currentTime + 0.3;
  for (;;) {
    const loop = Math.floor(melNext / N), n = hops[melNext % N], at = t0 + (loop * LOOP + n.s) * SPB;
    if (at > horizon) break;
    if (at >= actx.currentTime - 0.05) {
      const P = played(loop, n.idx);
      // panicked right notes are only louder; the harsh layer and hammer clack belong to wrong notes
      const harsh = P.wrong ? Math.max(1, P.panic) : 0;
      voice(P.m, at + (Math.random() - .5) * .012, n.d * SPB, P.vel * (.9 + Math.random() * .2), n.s >= 60, 1 + .5 * harsh);
      if (harsh) thump(at, harsh);
    }
    melNext++;
  }
}
// absolute song position in beats (loop number = floor(pos / LOOP))
function songPos() {
  if (!actx) return null;
  const t = actx.currentTime - t0;
  return t < 0 ? null : t / SPB;
}

// ---------- geometry ----------
const KX = 20, KW = 600, KY = 372, KH = 74, LOW = 48, HIGH = 84;
const isBlack = m => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);
const whites = []; for (let m = LOW; m <= HIGH; m++) if (!isBlack(m)) whites.push(m);
const wkw = KW / whites.length;
function keyRect(m) {
  while (m < LOW) m += 12; while (m > HIGH) m -= 12;
  if (!isBlack(m)) { const i = whites.indexOf(m); return { x: KX + i * wkw, y: KY, w: wkw, h: KH, black: false }; }
  const i = whites.indexOf(m - 1);
  return { x: KX + (i + 1) * wkw - wkw * 0.3, y: KY, w: wkw * 0.6, h: KH * 0.62, black: true };
}
const PAGES = [160, 320], PW = 160, SY = [242, 292], LS = 5, CLEFW = 22, BARW = (PW - 20 - CLEFW) / 2;
const sysOrigin = k => ({ x: PAGES[k >> 1] + 10, y: SY[k & 1] });
const LET = { 0: 0, 1: 0, 2: 1, 3: 2, 4: 2, 5: 3, 6: 3, 7: 4, 8: 4, 9: 5, 10: 6, 11: 6 };
const dia = m => (Math.floor(m / 12) - 1) * 7 + LET[m % 12];
function beatX(s) { const bar = Math.floor(s / 4), lb = bar & 7, o = sysOrigin(lb >> 1); return { o, x: o.x + CLEFW + (lb & 1) * BARW + (s - bar * 4) / 4 * (BARW - 8) + 7 }; }

// ---------- static layers (3 "boil" variants) ----------
function drawStatic(g, bk, seed) {
  R = mulberry32(seed);
  g.fillStyle = '#f3ead6'; g.fillRect(0, 0, W, H);
  hatch(g, G => G.rect(0, 0, W, 178), [0, 0, W, 178], '#e2cfa8', { gap: 4.5, alpha: .32, w: 1.5, angle: -1.15, cross: .5 });
  // lamp
  stroke(g, [[566, 94], [565, 132], [566, 168]], '#7d6040', 3, { passes: 3 });
  hatch(g, polyPath(wob(ellPts(566, 170, 24, 6), .8)), [540, 162, 52, 16], '#8e6c47', { gap: 1.6, alpha: .9, angle: 0 });
  const shade = wob([[530, 96], [602, 96], [588, 40], [544, 40], [530, 96]], 1.2);
  fillPts(g, shade, '#f7d98a', .55);
  hatch(g, polyPath(shade), [528, 38, 76, 60], '#f0b94a', { gap: 2.4, alpha: .8, angle: -1.35 });
  hatch(g, polyPath(shade), [528, 38, 76, 60], '#e0892f', { gap: 7, alpha: .35, angle: .4, layers: 1 });
  stroke(g, shade, '#c47128', 1.5);
  // lid + front panel
  box(g, -4, 178, W + 8, 24, '#a6bacb', null, { gap: 2, alpha: .85, angle: -.15, solid: '#b9c9d6', solidA: .5 });
  box(g, -4, 202, W + 8, 162, '#8ea8bf', null, { gap: 2.6, alpha: .75, angle: -1, solid: '#a8bdcf', solidA: .45 });
  hatch(g, G => G.rect(0, 202, W, 162), [0, 202, W, 162], '#6a89a4', { gap: 10, alpha: .3, angle: -.95, layers: 1 });
  stroke(g, [[-4, 179], [W + 4, 178]], '#56708a', 2.6, { passes: 3 });
  stroke(g, [[-4, 202], [W + 4, 202]], '#56708a', 1.8);
  // sheet music
  for (const px of PAGES) {
    const pts = wob(rectPts(px, 206, PW, 116), 1);
    fillPts(g, pts, '#fbf7ec');
    hatch(g, polyPath(pts), [px, 206, PW, 116], '#e6dfcc', { gap: 5, alpha: .35, angle: -1.2, w: 1.2 });
    stroke(g, pts, '#8d867a', 1.3);
  }
  stroke(g, [[320, 207], [320, 321]], '#b5ad9d', 1.2, { passes: 1 });
  for (let k = 0; k < 4; k++) {
    const { x, y } = sysOrigin(k);
    for (let l = 0; l < 5; l++) stroke(g, [[x, y - l * LS], [x + PW - 20, y - l * LS]], '#77716a', .8, { passes: 1, jit: .4, alpha: .8 });
    for (const bx of [x, x + CLEFW + BARW, x + PW - 20]) stroke(g, [[bx, y], [bx, y - 4 * LS]], '#77716a', .9, { passes: 1, jit: .3 });
    stroke(g, crSpline([[x + 6, y + 6], [x + 6, y - 4], [x + 7, y - 22], [x + 3, y - 20], [x + 4, y - 13], [x + 10, y - 8], [x + 10, y - 2], [x + 5, y + 1], [x + 2, y - 4], [x + 6, y - 8], [x + 9, y - 5]], 4), '#3a3632', 1.2, { passes: 1, jit: .3 });
    g.save(); g.fillStyle = '#3a3632'; g.font = '13px serif'; g.fillText('♭', x + 13, y - 8); g.restore();
  }
  // ledge + pencil
  box(g, 146, 322, 348, 10, '#c89f6c', '#80603f', { gap: 1.6, alpha: .9, angle: .1, lw: 1.3 });
  box(g, 392, 316, 62, 6, '#f0c24b', '#a07a22', { gap: 1.4, alpha: .9, angle: 0, lw: 1, solid: '#f4d06a' });
  fillPts(g, [[454, 316], [466, 319], [454, 322]], '#e8c898');
  fillPts(g, [[462, 318], [467, 319], [462, 320]], '#333');
  box(g, 386, 316, 6, 6, '#a9a9a9', null, { gap: 1.2, alpha: .9, solid: '#bbb' });
  box(g, 378, 316, 8, 6, '#e39a98', null, { gap: 1.2, alpha: .9, solid: '#eaa9a6' });
  // keybed, cheeks, white keys
  box(g, -4, 364, W + 8, 9, '#4f6a83', null, { gap: 1.5, alpha: .95, angle: 0 });

  const arm = st.air ? -5 : Math.sin(t * 3) * 1.5;
  blk(-bw / 2 - u, -bh + 2 * u + arm, u + 2, 1.5 * u);
  blk(bw / 2 - 2, -bh + 2 * u + (st.air ? -5 : -arm), u + 2, 1.5 * u);
  blk(-bw / 2, -bh, bw, bh);
  const ey = -bh + 1.4 * u, eyes = [-bw / 2 + 2 * u, -bw / 2 + 6 * u];
  if (st.expr === 'squint') {         // > <
    stroke(g, [[eyes[0], ey], [eyes[0] + u, ey + .75 * u], [eyes[0], ey + 1.5 * u]], '#2a1c17', 2.4, { passes: 2, jit: .3 });
    stroke(g, [[eyes[1] + u, ey], [eyes[1], ey + .75 * u], [eyes[1] + u, ey + 1.5 * u]], '#2a1c17', 2.4, { passes: 2, jit: .3 });
  } else if (st.expr === 'surprise') { // big square eyes with a glint
    for (const ex of eyes) { fillPts(g, rectPts(ex - 2, ey - 3, u + 4, 1.5 * u + 6), '#2a1c17', .95); fillPts(g, rectPts(ex, ey - 1, 3, 3), '#fff', .9); }
  } else {
    const blink = (t % 3.7) < 0.12 ? 0.15 : 1;
    for (const ex of eyes) { const eh = 1.5 * u * blink; fillPts(g, rectPts(ex, ey + (1.5 * u - eh) / 2, u, eh), '#2a1c17', .95); }
  }
  g.restore();
}

function drawNoteGlyph(g, x, y, col, a) {
  g.save(); g.globalAlpha = a; g.fillStyle = col; g.strokeStyle = col; g.lineWidth = 1.6; g.lineCap = 'round';
  g.beginPath(); g.ellipse(x, y, 4, 3, -0.35, 0, 7); g.fill();
  g.beginPath(); g.moveTo(x + 3.6, y); g.lineTo(x + 3.6, y - 15); g.quadraticCurveTo(x + 9, y - 11, x + 9, y - 6); g.stroke();
  g.restore();
}

// ---------- main loop ----------
let last = performance.now(), lastCur = null, catW = 0, startT = null, surpriseUntil = 0, bangUntil = 0, sweatT = -9, meowT = -9, impactT = -9, impactP = 0, impactX = 0;
const parts = [];
const [clawdC, clawdG] = makeLayer();
function frame(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
  const bf = Math.floor(now / 140), L = layers[bf % 3];
  const pos = songPos(), loop = pos == null ? 0 : Math.floor(pos / LOOP), beat = pos == null ? null : pos - loop * LOOP;
  const cur = beat == null ? null : mel.find(n => n.m !== null && beat >= n.s && beat < n.s + n.d) || null;
  const curWrong = !!(cur && played(loop, cur.idx).wrong);
  dark = Math.max(0, Math.min(1, dark + (lightOn ? -1 : 1) * dt / .25));
  const st = clawdState(pos, t);
  if (cur && cur !== lastCur && curWrong) {   // missed: startled, sweating, or both
    const r = Math.random();
    if (r < .67) { surpriseUntil = t + .7; bangUntil = t + .7; }
    if (r >= .33) sweatT = t;
    if (actx && Math.random() < .4 && t - meowT > 2.5) {  // the cat noticed
      const delay = .15 + Math.random() * .25;
      meowT = t + delay; meow(actx.currentTime + delay);
    }
  }
  st.expr = t < surpriseUntil ? 'surprise' : dark > .5 ? 'squint' : 'normal';
  if (cur && cur !== lastCur) {
    const P = played(loop, cur.idx);
    if (P.panic) { impactT = t; impactP = P.panic; impactX = keyCX(P.m); }
    parts.push({ x: st.x + (Math.random() - .5) * 50, y: 312, vx: (Math.random() - .5) * 18, vy: -28 - Math.random() * 16, age: 0, col: Math.random() < .5 ? '#e0662f' : '#3a3632' });
  }
  lastCur = cur;

  const shake = 1.8 * impactP * Math.max(0, 1 - (t - impactT) / .2);  // hard hits shake the room
  ctx.save(); ctx.translate((Math.random() - .5) * 2 * shake, (Math.random() - .5) * 2 * shake);
  ctx.drawImage(L.base, 0, 0, W, H);
  R = mulberry32(bf * 7919 + 1);
  const fl = 0.3 + Math.sin(t * 7) * .02 + Math.sin(t * 13.3) * .015;
  const lg = ctx.createRadialGradient(566, 92, 4, 566, 92, 150);
  const lit = 1 - dark;
  lg.addColorStop(0, `rgba(255,214,120,${(fl + .25) * lit})`); lg.addColorStop(.35, `rgba(255,205,110,${fl * .5 * lit})`); lg.addColorStop(1, 'rgba(255,200,100,0)');
  ctx.fillStyle = lg; ctx.fillRect(400, 0, 240, 260);
  if (lit > .01) hatch(ctx, G => G.ellipse(566, 98, 26, 5, 0, 0, 7), [540, 92, 52, 12], '#ffe9a8', { gap: 1.5, alpha: .9 * lit, angle: 0 });

  drawSheet(ctx, beat, cur, curWrong);
  drawKeys(ctx, beat, loop, L.blk);
  // Clawd (and its notes) sit on their own layer so they only dim a little in the dark and stay the visual focus
  clawdG.clearRect(0, 0, W, H);
  drawClawd(clawdG, st, t);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.age += dt; p.x += (p.vx + Math.sin(p.age * 3) * 8) * dt; p.y += p.vy * dt;
    if (p.age > 2.4) { parts.splice(i, 1); continue; }
    drawNoteGlyph(clawdG, p.x, p.y, p.col, Math.min(1, p.age * 4) * (1 - p.age / 2.4) * .85);
  }
  if (dark > 0) {
    clawdG.save(); clawdG.globalCompositeOperation = 'source-atop'; clawdG.fillStyle = `rgba(14,18,42,${.22 * dark})`; clawdG.fillRect(0, 0, W, H); clawdG.restore();
    ctx.fillStyle = `rgba(14,18,42,${.68 * dark})`; ctx.fillRect(0, 0, W, H);  // the cat is drawn after this: black fur, glowing eyes
  }
  ctx.drawImage(clawdC, 0, 0, W, H);
  if (t - impactT < .25) {  // impact lines around the slamming foot
    const q = (t - impactT) / .25, len = (8 + 6 * impactP) * (.4 + q);
    for (const a of [-2.6, -2.1, -1.57, -1.05, -.55]) {
      const r0 = 8 + q * 10;
      stroke(ctx, [[impactX + Math.cos(a) * r0, 378 + Math.sin(a) * r0], [impactX + Math.cos(a) * (r0 + len), 378 + Math.sin(a) * (r0 + len)]], '#ffb347', 2.2, { passes: 1, jit: .3, alpha: 1 - q });
    }
  }
  const running = actx && actx.state === 'running';
  catW = running ? Math.min(1, catW + dt / 1.2) : Math.max(0, catW - dt / 2.5);
  const pose = catPose(startT == null ? null : t - startT);
  if (pose.bottom) drawTail(ctx, t, beat);
  drawCat(ctx, t, beat, st.x, !!(cur && cur.m >= 79), catW, pose);

  if (t >= meowT && t - meowT < 1.1) {
    const q = (t - meowT) / 1.1, hx = pose.ox + 58 * pose.flip, hy = pose.oy - 33;
    label(ctx, '喵~', hx + 30 * Math.sign(pose.flip || 1), hy - 28 - q * 14, 18, '#fbf6e8', 1 - q);
  }
  const headY = 356 - st.lift - 40;
  if (t < bangUntil) for (let i = 0; i < 2; i++) label(ctx, '!', st.x + 36, headY - 4, 38, '#ffcf4a');
  if (t - sweatT < .9) {
    const a = 1 - (t - sweatT) / .9;
    for (const [dx, dy, s] of [[42, 4, 1], [-44, 10, .7]]) {
      const x = st.x + dx, y = headY + dy + (t - sweatT) * 16 * s;
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#a8dcff'; ctx.strokeStyle = '#3f86bd'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x, y - 8 * s); ctx.quadraticCurveTo(x + 5 * s, y, x, y + 4 * s); ctx.quadraticCurveTo(x - 5 * s, y, x, y - 8 * s); ctx.fill(); ctx.stroke(); ctx.restore();
    }
  }

  if (!actx) {
    fillPts(ctx, wob(rectPts(170, 500, 300, 56), 1.5), '#f6efdc', .85);
    stroke(ctx, wob(rectPts(170, 500, 300, 56), 1.2), '#5f7b95', 1.6);
    label(ctx, '▶  点一下，开演', 320, 537, 26, '#3a3632');
  } else {
    label(ctx, actx.state === 'running' ? '♪ Lullaby for a Black Cat — piano: Clawd' : '‖  暂停中，再点一下继续', 320, 540, 17, '#f4efe2', .9);
  }
  ctx.restore();
  ctx.drawImage(grain, 0, 0, W, H);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function toggle() {
  if (!actx) initAudio();
  else if (actx.state === 'running') actx.suspend(); else actx.resume();
}
function toggleLight() {
  lightOn = !lightOn;
  if (!lightOn) { const t = performance.now() / 1000; surpriseUntil = t + .9; bangUntil = t + .9; }
}
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (x > 520 && x < 612 && y > 30 && y < 180) toggleLight(); else toggle();
});
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'KeyL') toggleLight();
});
</script>
</body>
</html>
