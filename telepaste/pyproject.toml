[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telepaste"
version = "0.1.0"
description = "Send text and images to your own Telegram bot; they land on your desktop clipboard and in today's markdown note."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["telegram", "clipboard", "notes", "obsidian", "s3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.urls]
Repository = "https://github.com/kirisawa-subaru/light-sparkle"
Documentation = "https://github.com/kirisawa-subaru/light-sparkle/tree/main/telepaste"
Issues = "https://github.com/kirisawa-subaru/light-sparkle/issues"

[project.scripts]
telepaste = "telepaste.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["telepaste"]

[tool.hatch.build.targets.sdist]
include = ["telepaste/", "tests/", "deploy/", "README.md", "LICENSE", ".env.example"]
